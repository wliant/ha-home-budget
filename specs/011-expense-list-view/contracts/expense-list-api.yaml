openapi: 3.0.3
info:
  title: Expense List View API
  description: API endpoints for the expense list view feature (Feature 011)
  version: 1.0.0

paths:
  /api/expenses/list:
    get:
      summary: Get paginated, filtered, sorted expense list
      description: |
        Returns a paginated list of expenses with server-side filtering, sorting,
        and aggregate summary (total count + total amount).
        Year filter is mandatory (defaults to current year).
      operationId: getExpenseList
      tags:
        - Expenses
      parameters:
        - name: X-Hass-User
          in: header
          required: true
          schema:
            type: string
          description: Authenticated user (from Home Assistant proxy)
        - name: year
          in: query
          required: true
          schema:
            type: integer
            minimum: 2000
            maximum: 9999
          description: Filter by year (mandatory)
        - name: month
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 12
          description: Filter by month (optional)
        - name: categoryId
          in: query
          required: false
          schema:
            type: integer
            format: int64
          description: Filter by category ID (optional)
        - name: minAmount
          in: query
          required: false
          schema:
            type: number
            format: decimal
            minimum: 0
          description: Minimum expense amount inclusive (optional)
        - name: maxAmount
          in: query
          required: false
          schema:
            type: number
            format: decimal
            minimum: 0
          description: Maximum expense amount inclusive (optional)
        - name: createdBy
          in: query
          required: false
          schema:
            type: string
          description: Filter by creator username (optional)
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
          description: Page number (0-based)
        - name: size
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
          description: Page size
        - name: sortBy
          in: query
          required: false
          schema:
            type: string
            enum:
              - expenseDate
              - description
              - categoryName
              - amount
              - createdBy
            default: expenseDate
          description: Field to sort by
        - name: sortDirection
          in: query
          required: false
          schema:
            type: string
            enum:
              - ASC
              - DESC
            default: DESC
          description: Sort direction
      responses:
        '200':
          description: Paginated expense list with summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExpenseListResponse'
        '400':
          description: Invalid filter parameters (e.g., minAmount > maxAmount)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/expenses/years:
    get:
      summary: Get distinct years with expenses
      description: |
        Returns a list of distinct years that have at least one expense recorded.
        Used to populate the year filter dropdown.
      operationId: getExpenseYears
      tags:
        - Expenses
      parameters:
        - name: X-Hass-User
          in: header
          required: true
          schema:
            type: string
      responses:
        '200':
          description: List of years
          content:
            application/json:
              schema:
                type: array
                items:
                  type: integer
                example: [2026, 2025, 2024]

  /api/expenses/creators:
    get:
      summary: Get distinct expense creators
      description: |
        Returns a list of distinct usernames who have created at least one expense.
        Used to populate the "created by" filter dropdown.
      operationId: getExpenseCreators
      tags:
        - Expenses
      parameters:
        - name: X-Hass-User
          in: header
          required: true
          schema:
            type: string
      responses:
        '200':
          description: List of creator usernames
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
                example: ["alice", "bob", "charlie"]

components:
  schemas:
    ExpenseListResponse:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/ExpenseDTO'
        totalElements:
          type: integer
          format: int64
          description: Total number of matching expenses across all pages
        totalPages:
          type: integer
          description: Total number of pages
        currentPage:
          type: integer
          description: Current page number (0-based)
        pageSize:
          type: integer
          description: Items per page
        totalAmount:
          type: number
          format: decimal
          description: Sum of amounts for all matching expenses (not just current page)
        sortBy:
          type: string
          description: Current sort field
        sortDirection:
          type: string
          enum: [ASC, DESC]
          description: Current sort direction
      example:
        content:
          - id: 1
            amount: 42.50
            description: "Groceries at Whole Foods"
            expenseDate: "2026-01-15"
            budgetId: 10
            categoryId: 5
            categoryName: "Groceries"
            categoryIcon: "🛒"
            createdBy: "alice"
            createdAt: "2026-01-15T14:30:00"
            updatedAt: "2026-01-15T14:30:00"
            version: 0
            warnings: []
        totalElements: 156
        totalPages: 4
        currentPage: 0
        pageSize: 50
        totalAmount: 4523.75
        sortBy: "expenseDate"
        sortDirection: "DESC"

    ExpenseDTO:
      type: object
      properties:
        id:
          type: integer
          format: int64
        amount:
          type: number
          format: decimal
        description:
          type: string
        expenseDate:
          type: string
          format: date
        budgetId:
          type: integer
          format: int64
        categoryId:
          type: integer
          format: int64
          nullable: true
        categoryName:
          type: string
          nullable: true
        categoryIcon:
          type: string
          nullable: true
        createdBy:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        version:
          type: integer
          format: int64
        warnings:
          type: array
          items:
            type: string

    ErrorResponse:
      type: object
      properties:
        status:
          type: integer
        error:
          type: string
        message:
          type: string
        timestamp:
          type: string
          format: date-time
