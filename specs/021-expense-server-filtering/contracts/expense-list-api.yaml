openapi: 3.0.3
info:
  title: Expense List API - categoryIds Enhancement
  version: 1.1.0
  description: Updated expense list endpoint with multi-category filtering support

paths:
  /api/expenses/list:
    get:
      summary: Get paginated expense list with filters
      description: |
        Returns a paginated list of expenses filtered by the provided parameters.
        When `categoryIds` is provided, only expenses in those categories are returned.
        When only `categoryId` is provided, existing parent-expansion behavior applies.
        When neither is provided, no category filter is applied.
      parameters:
        - name: year
          in: query
          required: false
          schema:
            type: integer
          description: Filter by year
        - name: month
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 12
          description: Filter by month (1-12)
        - name: categoryId
          in: query
          required: false
          schema:
            type: integer
            format: int64
          description: Filter by single category ID (backward compatible, expands to children for parent categories)
        - name: categoryIds
          in: query
          required: false
          schema:
            type: array
            items:
              type: integer
              format: int64
          style: form
          explode: false
          description: |
            Filter by multiple category IDs (comma-separated, e.g., categoryIds=1,2,3).
            Takes precedence over categoryId when provided.
            No automatic child expansion - client must include all desired IDs.
        - name: minAmount
          in: query
          required: false
          schema:
            type: number
          description: Minimum expense amount (inclusive)
        - name: maxAmount
          in: query
          required: false
          schema:
            type: number
          description: Maximum expense amount (inclusive)
        - name: createdBy
          in: query
          required: false
          schema:
            type: string
          description: Filter by creator username
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 0
          description: Page number (0-based)
        - name: size
          in: query
          required: false
          schema:
            type: integer
            default: 50
            maximum: 100
          description: Page size
        - name: sortBy
          in: query
          required: false
          schema:
            type: string
            default: expenseDate
            enum: [expenseDate, description, amount, createdBy, categoryName]
          description: Sort field
        - name: sortDirection
          in: query
          required: false
          schema:
            type: string
            default: DESC
            enum: [ASC, DESC]
          description: Sort direction
      responses:
        '200':
          description: Paginated expense list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExpenseListResponse'

components:
  schemas:
    ExpenseListResponse:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/ExpenseDTO'
        totalElements:
          type: integer
          format: int64
          description: Total number of expenses matching all filters
        totalPages:
          type: integer
        currentPage:
          type: integer
        pageSize:
          type: integer
        totalAmount:
          type: number
          description: Sum of amounts for all expenses matching all filters (not just current page)
        sortBy:
          type: string
        sortDirection:
          type: string

    ExpenseDTO:
      type: object
      properties:
        id:
          type: integer
          format: int64
        amount:
          type: number
        description:
          type: string
        expenseDate:
          type: string
          format: date
        categoryId:
          type: integer
          format: int64
        categoryName:
          type: string
        categoryIcon:
          type: string
        createdBy:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
