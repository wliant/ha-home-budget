<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Budget App Unavailable</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f5f5f5;
            color: #333;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .container {
            text-align: center;
            padding: 2rem;
            max-width: 480px;
        }
        .icon {
            font-size: 4rem;
            margin-bottom: 1rem;
        }
        h1 {
            font-size: 1.5rem;
            font-weight: 600;
            margin-bottom: 0.75rem;
            color: #1a1a1a;
        }
        p {
            font-size: 1rem;
            line-height: 1.6;
            color: #666;
            margin-bottom: 0.5rem;
        }
        .hint {
            font-size: 0.875rem;
            color: #999;
            margin-top: 1.5rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon">&#x1F4B0;</div>
        <h1>Budget App Unavailable</h1>
        <p>The application host appears to be offline or unreachable.</p>
        <p>The budget application services may still be starting up.</p>
        <p class="hint">Check the add-on configuration to verify the server host address, or try again in a moment.</p>
    </div>
</body>
</html>
