spring:
  application:
    name: home-budget-backend

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/homebudget}
    username: ${SPRING_DATASOURCE_USERNAME:budget_user}
    password: ${SPRING_DATASOURCE_PASSWORD:budget_password}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml
    enabled: true

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info,loggers
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
    loggers:
      enabled: true

logging:
  level:
    root: INFO
    com.homebudget: INFO
    org.springframework.boot: INFO
    org.springframework.web: INFO
    org.hibernate: WARN
    com.zaxxer.hikari: WARN
    liquibase: INFO

  # Structured logging configuration
  async:
    queue-size: 10000

  # Sensitive field patterns for data masking
  sensitive-fields: password,token,secret,apiKey,authorization,creditCard

  # Performance thresholds (milliseconds)
  slow-request:
    threshold-ms: 1000
  slow-query:
    threshold-ms: 100

# Application configuration
app:
  dev-mode: false
  default-dev-user: ""
