# Development Profile Configuration
# This profile is activated when SPRING_PROFILES_ACTIVE=dev

# Development mode - enables default X-Hass-User header when missing
app.dev-mode=true

# Default user identity for development
# Used when X-Hass-User header is not provided in development mode
app.default-dev-user=dev-user

# Logging configuration for development
logging.level.com.homebudget=DEBUG
