# Production Profile Configuration
# This profile should be activated in production environments using:
# SPRING_PROFILES_ACTIVE=prod

# Production Log Levels
# Set conservative log levels for production to minimize performance impact
logging.level.com.homebudget=INFO
logging.level.org.springframework.boot=WARN
logging.level.org.springframework.web=WARN
logging.level.org.hibernate=ERROR
logging.level.com.zaxxer.hikari=WARN

# Disable verbose SQL logging in production
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Production database connection pool settings
# Increase pool size for production load
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# Disable development tools in production
spring.devtools.restart.enabled=false
spring.devtools.livereload.enabled=false

# Production application settings
app.dev-mode=false
app.default-dev-user=
