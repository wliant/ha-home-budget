version: '3.8'

services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-dev_root_password}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-homebudget}
      MYSQL_USER: ${MYSQL_USER:-budget_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-budget_password}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - homebudget-network

  minio:
    image: quay.io/minio/minio:latest
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - homebudget-network
    restart: unless-stopped

  backend:
    build:
      context: ./budget-backend
      dockerfile: Dockerfile
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-homebudget}
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER:-budget_user}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:-budget_password}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin123}
      MINIO_BUCKET_NAME: ${MINIO_BUCKET_NAME:-homebudget-files}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    depends_on:
      mysql:
        condition: service_healthy
      minio:
        condition: service_healthy
    volumes:
      - ./budget-backend/src:/app/src
      - backend-m2:/root/.m2
    networks:
      - homebudget-network
    restart: unless-stopped

  ocr-processor:
    build:
      context: ./ocr-processor
      dockerfile: Dockerfile.dev
    environment:
      OLLAMA_HOST: ${OLLAMA_HOST:-192.168.1.248:11434}
    ports:
      - "${OCR_PROCESSOR_PORT:-8082}:8082"
    volumes:
      - ./ocr-processor/src:/app/src
    networks:
      - homebudget-network
    restart: unless-stopped

  frontend:
    build:
      context: ./budget-frontend
      dockerfile: Dockerfile
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080}
      NODE_ENV: ${NODE_ENV:-development}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      - backend
    volumes:
      - ./budget-frontend:/app
      - /app/node_modules
      - /app/.next
    networks:
      - homebudget-network
    restart: unless-stopped

volumes:
  mysql-data:
    driver: local
  minio-data:
    driver: local
  backend-m2:
    driver: local

networks:
  homebudget-network:
    driver: bridge
