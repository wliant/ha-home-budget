[project]
name = "ocr-processor"
version = "0.1.0"
description = "Receipt OCR processor using LangGraph, PaddleOCR, and Ollama"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "python-multipart>=0.0.18",
    "langchain>=0.3.0",
    "langchain-community>=0.3.0",
    "langgraph>=0.2.0",
    "langchain-ollama>=0.2.0",
    "opencv-python-headless>=4.6.0",
    "paddlepaddle>=3.0.0,<4.0.0; platform_machine == 'x86_64'",
    "paddleocr>=3.0.0,<4.0.0",
    "numpy>=1.21.0",
    "pillow>=11.0.0",
    "pymupdf>=1.25.0",
    "httpx>=0.28.0",
    "structlog>=24.0.0",
    "pydantic-settings>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ocr_processor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=0.24.0",
]
