version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: homebudget-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql-data:/var/lib/mysql
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - homebudget-network
    restart: unless-stopped

  minio:
    image: quay.io/minio/minio:latest
    container_name: homebudget-minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
    volumes:
      - minio-data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    ports:
      - "9000:9000"
      - "9001:9001"
    networks:
      - homebudget-network
    restart: unless-stopped

  backend:
    build:
      context: ./budget-backend
      dockerfile: Dockerfile.prod
    container_name: homebudget-backend
    ports:
      - "9090:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE}
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD}
      SPRING_PROFILES_ACTIVE: prod
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin123}
      MINIO_BUCKET_NAME: ${MINIO_BUCKET_NAME:-homebudget-files}
    depends_on:
      mysql:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - homebudget-network
    restart: unless-stopped

  ocr-processor:
    platform: linux/amd64
    build:
      context: ./ocr-processor
      dockerfile: Dockerfile
      platforms:
        - linux/amd64
    container_name: homebudget-ocr-processor
    environment:
      OLLAMA_HOST: ${OLLAMA_HOST:-192.168.1.248:11434}
    networks:
      - homebudget-network
    restart: unless-stopped

  frontend:
    build:
      context: ./budget-frontend
      dockerfile: Dockerfile.prod
      args:
        NEXT_PUBLIC_API_URL: ""
    container_name: homebudget-frontend
    ports:
      - "3000:3000"
    environment:
      INTERNAL_API_URL: http://backend:8080
      NODE_ENV: production
    depends_on:
      - backend
    networks:
      - homebudget-network
    restart: unless-stopped

  nginx:
    image: nginx:1.25-alpine
    container_name: homebudget-nginx
    ports:
      - "${NGINX_PORT:-80}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend
    networks:
      - homebudget-network
    restart: unless-stopped

volumes:
  mysql-data:
    driver: local
  minio-data:
    driver: local

networks:
  homebudget-network:
    driver: bridge
