version: '3.8'

services:
  backend:
    build:
      context: ./budget-backend
      dockerfile: Dockerfile.prod
    container_name: homebudget-backend
    ports:
      - "9090:8080"
    environment:
      SPRING_DATASOURCE_URL: ${MYSQL_URL}
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD}
      SPRING_PROFILES_ACTIVE: prod
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin123}
      MINIO_BUCKET_NAME: ${MINIO_BUCKET_NAME:-homebudget-files}
    networks:
      - homebudget-network
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
  ocr-processor:
    platform: linux/amd64
    build:
      context: ./ocr-processor
      dockerfile: Dockerfile
      platforms:
        - linux/amd64
    container_name: homebudget-ocr-processor
    environment:
      OLLAMA_HOST: ${OLLAMA_HOST:-192.168.1.248:11434}
    networks:
      - homebudget-network
    restart: unless-stopped

  frontend:
    build:
      context: ./budget-frontend
      dockerfile: Dockerfile.prod
      args:
        NEXT_PUBLIC_API_URL: ""
    container_name: homebudget-frontend
    ports:
      - "3000:3000"
    environment:
      INTERNAL_API_URL: http://backend:8080
      NODE_ENV: production
    depends_on:
      - backend
    networks:
      - homebudget-network
    restart: unless-stopped

  nginx:
    image: nginx:1.25-alpine
    container_name: homebudget-nginx
    ports:
      - "${NGINX_PORT:-80}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend
    networks:
      - homebudget-network
    restart: unless-stopped

networks:
  homebudget-network:
    driver: bridge